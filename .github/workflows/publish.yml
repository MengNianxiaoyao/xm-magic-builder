name: Release and publish extension

on:
  push:
    branches:
      - main
    paths:
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - package.json

  workflow_dispatch:
    inputs:
      pre_release:
        description: '发布为预发布版本'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username == 'MengNianxiaoyao'

    permissions:
      contents: write

    env:
      EXT_VERSION: ""
      IS_PRELEASE: "false"

    outputs:
      version: ${{ env.EXT_VERSION }}
      isPreRelease: ${{ env.IS_PRELEASE }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6.0.3
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Parse version from package.json
        run: |
          echo "EXT_VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: Resolve release channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IS_PRELEASE=${{ inputs.pre_release }}" >> $GITHUB_ENV
          else
            echo "IS_PRELEASE=$(node -p -e "require('./package.json').release?.preRelease === true")" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-changelog.mjs "$EXT_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Package pre-release
        if: env.IS_PRELEASE == 'true'
        run: npx --yes @vscode/vsce@latest package --pre-release

      - name: Package release
        if: env.IS_PRELEASE == 'false'
        run: npx --yes @vscode/vsce@latest package

      - uses: actions/upload-artifact@v4
        with:
          name: xm-magic-builder-${{ env.EXT_VERSION }}.vsix
          path: ./xm-magic-builder-${{ env.EXT_VERSION }}.vsix

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EXT_VERSION }}
          name: Release ${{ env.EXT_VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ env.IS_PRELEASE == 'true' }}
          files: ./xm-magic-builder-${{ env.EXT_VERSION }}.vsix

  publish:
    needs: release

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v4
        with:
          name: xm-magic-builder-${{ needs.release.outputs.version }}.vsix

      - name: Publish pre-release via OIDC
        if: needs.release.outputs.isPreRelease == 'true'
        run: >-
          npx --yes @vscode/vsce@latest publish --oidc --pre-release
          --packagePath ./xm-magic-builder-${{ needs.release.outputs.version }}.vsix

      - name: Publish release via OIDC
        if: needs.release.outputs.isPreRelease == 'false'
        run: >-
          npx --yes @vscode/vsce@latest publish --oidc
          --packagePath ./xm-magic-builder-${{ needs.release.outputs.version }}.vsix
