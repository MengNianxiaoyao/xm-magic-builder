name: Release and publish extension

on:
  push:
    branches:
      - main
    paths:
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - package.json

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.username == 'MengNianxiaoyao'

    permissions:
      contents: write

    env:
      EXT_VERSION: ""
      IS_PRELEASE: "false"

    outputs:
      version: ${{ env.EXT_VERSION }}
      isPreRelease: ${{ env.IS_PRELEASE }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6.0.3
        with:
          version: latest

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Parse version from package.json
        run: |
          echo "EXT_VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV
          echo "IS_PRELEASE=$(node -p -e "const p = require('./package.json').version.split('.'); (p.length === 3 && /^\d{8}$/.test(p[2])).toString()")" >> $GITHUB_ENV

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm install -g vsce

      - run: vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: xm-magic-builder-${{ env.EXT_VERSION }}.vsix
          path: ./xm-magic-builder-${{ env.EXT_VERSION }}.vsix

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EXT_VERSION }}
          name: Release ${{ env.EXT_VERSION }}
          prerelease: ${{ env.IS_PRELEASE == 'true' }}
          files: ./xm-magic-builder-${{ env.EXT_VERSION }}.vsix

  publish:
    needs: release

    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xm-magic-builder-${{ needs.release.outputs.version }}.vsix

      - name: Publish to marketplace
        uses: HaaLeo/publish-vscode-extension@c1a0486c5a3eed24e8c21d4e37889a7c4c60c443
        with:
          pat: ${{ secrets.PUBLISHER_KEY }}
          registryUrl: https://marketplace.visualstudio.com
          preRelease: ${{ needs.release.outputs.isPreRelease == 'true' }}
          extensionFile: ./xm-magic-builder-${{ needs.release.outputs.version }}.vsix
